<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeJump - BrokenNes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14' font-size='14'>⏱️</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/fonts.css">
</head>
<body>
  <div id="pixelBgHost" class="pixel-bg-host"></div>
  
  <div class="tj-root">
    <main class="tj-main">
      <!-- Start Panel -->
      <section id="startPanel" class="tj-panel active">
        <div class="tj-card">
          <h2 class="tj-card-title">Configuration</h2>
          
          <div class="tj-input-group">
            <label for="intervalInput" class="tj-label">
              Time Between Saves:
            </label>
            <div class="tj-input-row">
              <input 
                type="number" 
                id="intervalInput" 
                class="tj-input" 
                value="2" 
                min="0.1" 
                max="60" 
                step="0.1"
              >
              <span class="tj-unit">seconds</span>
            </div>
            <p class="tj-hint">
              TimeJump will capture a savestate every N seconds while running
            </p>
          </div>

          <div class="tj-actions">
            <button id="btnStart" class="tj-btn tj-btn-primary">
              <span class="tj-btn-icon">▶</span>
              Start TimeJump
            </button>
          </div>
        </div>

        <div class="tj-info">
          <p>TimeJump automatically captures savestates at regular intervals, allowing you to jump backward in time during gameplay.</p>
        </div>
      </section>

      <!-- Running Panel (hidden by default) -->
      <section id="runningPanel" class="tj-panel">
        <div class="tj-card">
          <div class="tj-actions">
            <button id="btnJump" class="tj-btn tj-btn-jump">
              <span class="tj-btn-icon">⚡</span>
              JUMP
            </button>
            <button id="btnStop" class="tj-btn tj-btn-danger">
              <span class="tj-btn-icon">⏹</span>
              Stop
            </button>
          </div>

          <div class="tj-visualization">
            <div id="stateGrid" class="tj-state-grid">
              <!-- State blocks will be added here dynamically -->
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Status Toast -->
  <div id="toast" class="tj-toast"></div>

  <script src="../shared/webapi.js"></script>
  <script src="timejump.js"></script>
</body>
</html>
