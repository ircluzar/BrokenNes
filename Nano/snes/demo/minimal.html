<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nano SNES: minimal</title></head>
<body>
<button id="go">Play a coin</button>
<script src="../dist/nano-snes.js"></script>
<script>
  let synth;
  go.onclick = async () => {
    synth ??= await BrokenNesNanoSNES.create();   // inside a click: browsers keep a page silent until the user interacts
    synth.play('coin');                         // or synth.noteOn('C4', 1, { preset: 'piano', duration: 0.5 })
  };
</script>
</body>
</html>
