<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagine a Bug</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="imagineBugRoot">
    <div class="ib-panel">
      <button id="btnPrimary" class="ib-btn ib-btn-icon" type="button" aria-label="Create Savestate">
        <svg id="iconCrosshair" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="3" />
          <line x1="24" y1="6" x2="24" y2="14" stroke="currentColor" stroke-width="3" />
          <line x1="24" y1="34" x2="24" y2="42" stroke="currentColor" stroke-width="3" />
          <line x1="6" y1="24" x2="14" y2="24" stroke="currentColor" stroke-width="3" />
          <line x1="34" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="3" />
        </svg>
        <svg id="iconRetry" class="hidden" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>
      </button>
      </div>

      <div class="ib-panel ib-panel-right">
        <button id="btnMenu" class="ib-btn ib-btn-icon" type="button" aria-label="Open Glitch Harvester">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <line x1="10" y1="14" x2="38" y2="14" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <line x1="10" y1="24" x2="38" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <line x1="10" y1="34" x2="38" y2="34" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <div id="drawOverlay" class="ib-draw-overlay hidden">
      <div class="ib-draw-hint">Draw a shape to target the scanlines</div>
      <canvas id="drawCanvas"></canvas>
    </div>

    <div class="ib-explain-square" aria-label="Target the Beam explanation">
      Target the Beam is an experimental corruptor that lets you select the render scanlines to corrupt cpu instructions as they draw the pixels to the frame. Result may vary.
    </div>
  </div>

  <script src="../shared/webapi.js"></script>
  <script src="imagine-bug.js"></script>
</body>
</html>
