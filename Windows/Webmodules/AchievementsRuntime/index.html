<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements Runtime - BrokenNes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏆</text></svg>">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="achievements-overlay">
    <!-- Achievements will be dynamically added here -->
  </div>

  <button id="returnToDeckButton" class="return-to-deck-button" type="button">
    Return to Deck Builder
  </button>

  <button id="showAchievementsButton" class="return-to-deck-button achievements-button" type="button">
    Achievements
  </button>

  <div id="achievementsListModal" class="achievements-list-modal-backdrop" style="display:none;">
    <div class="achievements-list-modal" onclick="event.stopPropagation()">
      <h3 class="achievements-list-title">Achievements</h3>
      <div class="achievements-list-body">
        <div id="achievementsListSummary" class="achievements-list-summary">0/0 unlocked</div>
        <div id="achievementsListContainer" class="achievements-list-container">
          <div class="achievements-list-empty">No achievements found for this game.</div>
        </div>
      </div>
      <div class="achievements-list-footer">
        <button id="closeAchievementsListButton" type="button" class="achievements-list-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Achievement Unlock Modal -->
  <div id="achievementModal" class="achievement-modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-text">
        <strong>Cleared:</strong> <span id="modalAchievementName"></span>
      </div>
      <div class="modal-progress">
        <div id="modalProgressBar" class="modal-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="../shared/storage.js"></script>
  <script src="../shared/gameSave.js"></script>
  <script src="../shared/webapi.js"></script>
  <script src="../shared/achievements.js"></script>
  <script src="script.js"></script>
</body>
</html>
