<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECK BUILDER - BrokenNes</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="../shared/story-character-modal.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/fonts.css">
</head>
<body>
  <div id="pixelBgHost" class="pixel-bg-host"></div>
  
  <div class="deck-root">
    <h2 class="deck-title">DECK BUILDER</h2>
    
    <section class="opt-section">
      <h3 class="opt-h3">SUMMARY</h3>
      <div class="summary-box">
        <div class="summary-row">
          <span class="label">Owned Cores</span>
          <span class="value" id="ownedCores">0/0</span>
        </div>
        <div class="summary-row">
          <span class="label">Achievement stars</span>
          <span class="value" id="achievementStars">0</span>
        </div>
        <div class="summary-row">
          <span class="label">Progress</span>
          <span class="value" id="progressLevel">Level 1</span>
        </div>
      </div>
    </section>
    
    <section class="opt-section action-panel" aria-label="Deck Builder actions">
      <div class="action-layout">
        <a class="btn-nes action-primary" href="../Continue/index.html">Continue Deck Builder</a>
        <div class="action-secondary">
          <a class="btn-nes action-secondary-btn" href="../Story/index.html" id="btnReplayStory">Watch Story Again</a>
          <a class="btn-nes action-secondary-btn" href="../Cores/index.html">View Unlocked Cores</a>
        </div>
      </div>
    </section>
    
    <div class="deck-footer">
      <a href="../Home/index.html?skipHW=1" class="deck-link">RETURN</a>
    </div>
  </div>

  <div id="storyCharacterModal" class="modal-backdrop" style="display: none;">
    <div class="card shadow-xl story-character-modal">
      <div class="card-body">
        <h2 class="story-character-title">Choose a character</h2>
        <p class="story-character-copy">Select who should replay the story cutscene.</p>
        <div id="storyCharacterGrid" class="story-character-grid" role="group" aria-label="Story characters"></div>
        <div class="story-character-actions">
          <button class="btn-nes story-character-cancel" id="storyCharacterCancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio System -->
  <!-- Audio now handled by audio engine via webAPI -->

  <!-- Dependencies -->
  <script src="../shared/storage.js"></script>
  <script src="../shared/gameSave.js"></script>
  <script src="../shared/webapi.js"></script>
  <!-- Audio now handled by audio engine via webAPI -->
  <script src="../shared/homePixelBg.js"></script>
  <script src="../shared/story-actors.js"></script>
  <script src="deckbuilder.js"></script>
</body>
</html>
