<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeJump - BrokenNes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14' font-size='14'>⏱️</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/fonts.css">
</head>
<body>
  <div id="pixelBgHost" class="pixel-bg-host"></div>
  
  <div class="tj-root">
    <main class="tj-main">
      <!-- Start Panel -->
      <section id="startPanel" class="tj-panel active tj-start-screen">
        <div class="tj-start-content">
          <div class="tj-galaxy-container">
            <div class="tj-galaxy"></div>
          </div>
          
          <h1 class="tj-logo">TIME JUMP</h1>
          
          <div class="tj-start-actions">
            <button id="btnStart" class="tj-btn tj-btn-start-big">
              START
            </button>
          </div>

          <div id="errorMessage" class="tj-error-message" style="display: none;"></div>
        </div>
      </section>

      <!-- Running Panel (hidden by default) -->
      <section id="runningPanel" class="tj-panel">
        <div class="tj-card">
          <div class="tj-actions">
            <button id="btnJump" class="tj-btn tj-btn-jump">
              <span class="tj-btn-icon">⚡</span>
              JUMP
            </button>
            <button id="btnReset" class="tj-btn tj-btn-warning">
              <span class="tj-btn-icon">🔄</span>
              Reset
            </button>
            <button id="btnStop" class="tj-btn tj-btn-danger">
              <span class="tj-btn-icon">⏹</span>
              Stop
            </button>
          </div>

          <div class="tj-level-container">
            <div id="levelDisplay" class="tj-level-display">Level 0</div>
            <div class="tj-level-progress">
              <div id="levelProgressBar" class="tj-level-progress-bar"></div>
            </div>
          </div>

          <div class="tj-visualization">
            <div id="stateGrid" class="tj-state-grid">
              <!-- State blocks will be added here dynamically -->
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Status Toast -->
  <div id="toast" class="tj-toast"></div>

  <script src="../shared/webapi.js"></script>
  <script src="timejump.js"></script>
</body>
</html>
