<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements Test - BrokenNes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏆</text></svg>">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 Achievements</h1>
      <button id="btnResetAchievements" class="reset-button">Reset Achievements</button>
    </header>

    <div id="achievementsContainer" class="achievements-container">
      <p class="empty-state">Loading achievements...</p>
    </div>

    <!-- Hidden controls for programmatic access -->
    <button id="btnInit" style="display:none;"></button>
    <button id="btnRefresh" style="display:none;"></button>
    <button id="btnMonitor" style="display:none;"></button>
    <div id="statusMessage" style="display:none;"></div>
  </div>

  <!-- Achievement Unlock Modal -->
  <div id="achievementModal" class="achievement-modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-text">
        <strong>Cleared:</strong> <span id="modalAchievementName"></span>
      </div>
      <div class="modal-progress">
        <div id="modalProgressBar" class="modal-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="../shared/storage.js"></script>
  <script src="../shared/gameSave.js"></script>
  <script src="../shared/webapi.js"></script>
  <script src="../shared/achievements.js"></script>
  <script src="script.js"></script>
</body>
</html>
